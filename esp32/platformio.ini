; PrioSense — ESP32-variant (Smart Panlee SC01 Plus + 1 of 2× Ai-Thinker Ra-02)
;
; Bouwen en flashen (SC01 Plus via USB-C aan de Mac):
;   pio run -t upload        → bouwen + flashen
;   pio device monitor       → seriële log (115200)

[env:sc01plus]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

; SC01 Plus: ESP32-S3 met 16 MB flash en quad-PSRAM.
board_build.flash_size       = 16MB
board_upload.flash_size      = 16MB
board_build.partitions       = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.f_flash          = 80000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1      ; seriële log via de USB-C-poort
    -DARDUINO_USB_MODE=1
    -Wall

lib_deps =
    lovyan03/LovyanGFX@1.1.16

monitor_speed = 115200
